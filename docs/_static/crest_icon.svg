<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="CREST icon">
  <title>CREST icon</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF5FB"/>
      <stop offset="100%" stop-color="#E6F9F0"/>
    </linearGradient>
    <clipPath id="clip">
      <circle cx="50" cy="50" r="46"/>
    </clipPath>
  </defs>

  <circle cx="50" cy="50" r="48" fill="url(#bg)" stroke="#1B6CA8" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="48" fill="none"    stroke="#2A9D5C" stroke-width="2.5"
          stroke-dasharray="75 302" stroke-dashoffset="-75"/>

  <g clip-path="url(#clip)">
    <!-- L1 → L2 -->
    <line x1="50" y1="25" x2="28" y2="48" stroke="#4A90C4" stroke-width="2.5"  stroke-linecap="round"/>
    <line x1="50" y1="25" x2="72" y2="48" stroke="#4A90C4" stroke-width="2.5"  stroke-linecap="round"/>
    <!-- cross-edge -->
    <line x1="34" y1="50" x2="66" y2="50" stroke="#7BB8DC" stroke-width="1.5"  stroke-dasharray="4 3"/>
    <!-- L2 → L3 -->
    <line x1="28" y1="55" x2="16" y2="74" stroke="#3DBE76" stroke-width="2.2"  stroke-linecap="round"/>
    <line x1="28" y1="55" x2="44" y2="78" stroke="#3DBE76" stroke-width="2.2"  stroke-linecap="round"/>
    <line x1="72" y1="55" x2="56" y2="78" stroke="#3DBE76" stroke-width="2.2"  stroke-linecap="round"/>
    <line x1="72" y1="55" x2="84" y2="74" stroke="#3DBE76" stroke-width="2.2"  stroke-linecap="round"/>

    <!-- Apex -->
    <circle cx="50" cy="17" r="8.5"  fill="#F5A623" stroke="#C8841C" stroke-width="2"/>
    <!-- L2 -->
    <circle cx="28" cy="50" r="7"    fill="#1B6CA8" stroke="#155990" stroke-width="2"/>
    <circle cx="72" cy="50" r="7"    fill="#1B6CA8" stroke="#155990" stroke-width="2"/>
    <!-- L3 -->
    <circle cx="16" cy="76" r="5.5"  fill="#2A9D5C" stroke="#1E7A45" stroke-width="1.8"/>
    <circle cx="44" cy="80" r="5.5"  fill="#2A9D5C" stroke="#1E7A45" stroke-width="1.8"/>
    <circle cx="56" cy="80" r="5.5"  fill="#2A9D5C" stroke="#1E7A45" stroke-width="1.8"/>
    <circle cx="84" cy="76" r="5.5"  fill="#2A9D5C" stroke="#1E7A45" stroke-width="1.8"/>
  </g>
</svg>

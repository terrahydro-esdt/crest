# Hard requirements for running documentation generator (sphinx)
# WARNING: Keep this up-to-date!
name: crest_doc
channels:
 - conda-forge
 - defaults

dependencies:
  - python=3.10
  - ipykernel=6.19
  # Documentation packages
  - sphinx=7.2.5
  - pandoc=3.1.3
  - pip
  - pip:
     - sphinx_autodoc_typehints
     - furo
     - sphinx_rtd_theme
     - sphinx-design
     - nbsphinx
     - nbsphinx-link


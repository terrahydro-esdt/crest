# CREST CPU environment
name: crest_cpu

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - tensorflow=2.10
  - pytest=7.1.2
  - matplotlib=3.7.1
  - tqdm=4.64.1
  - zarr=2.13.3
  - pandas=1.5.3
  - numpy=1.22
  - fsspec=2023.3.0
  - s3fs=2023.3.0
  - xarray[parallel]=2022.11.0
  - sparse=0.14.0
  - pyarrow=11.0.0
  - networkx=3.1
  - ipykernel=6.19
  - dask=2022.7.0
  - bottleneck=1.3.5
  - cloudpickle=2.0.0
  - ipywidgets=7.7.1
  - seaborn=0.13.0
  - pip=23.0.1
  - jsonpickle=3.0.2
  - netCDF4=1.6.2
  - scikit-learn=1.3.0
  - cython=0.29.28
  - gdal=3.6.2
  - setuptools<65
  - rasterio=1.3.10
  - s3path=0.6.2
  - pyvis=0.2.0
  - python-fastjsonschema=2.21.2
  - sparse>=0.15,<0.16
  - nbconvert=7.16.6
  - nbconvert-pandoc=7.16.6
  - pandoc=3.7.0.2
  - pip:
    - pyreadline3==3.4.1
    - crick==0.0.3
    - polars==0.18.8
    - opencv-python==4.11.0.86
    - osmnx==2.0.3
    - geopandas==1.0.1
      

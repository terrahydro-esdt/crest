# CREST CPU environment
name: crest_cpu

channels:
 - conda-forge
 - defaults

dependencies:
  - python=3.10
  - tensorflow=2.10
  - pytest=7.2.0
  - matplotlib=3.7.1
  - tqdm=4.64.1
  - zarr=2.13.6
  - pandas=1.5.3
  - fsspec=2023.3.0
  - xarray[parallel]=2022.11.0
  - networkx=2.8.8
  - ipykernel=6.19
  - dask=2022.7.0
  - scikit-learn=1.2.1
  - bottleneck=1.3.5
  - cloudpickle=2.2.1

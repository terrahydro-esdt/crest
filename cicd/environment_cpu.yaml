# CREST CPU environment
name: crest_cpu

channels:
 - defaults

dependencies:
  - python=3.10
  - tensorflow=2.10
  - pytest=7.1.2
  - matplotlib=3.7.1
  - tqdm=4.64.1
  - zarr=2.13.3
  - pandas=1.5.3
  - numpy=1.23.5
  - fsspec=2023.3.0
  - xarray[parallel]=2022.11.0
  - networkx=2.8.4
  - ipykernel=6.19
  - dask=2022.7.0
  - bottleneck=1.3.5
  - cloudpickle=2.0.0
  - sparse=0.14.0

  # Specify conda-forge directly where necessary
  - conda-forge::scikit-learn=1.2.1

[metadata]
name = crest
author = Craig Pelissier
author_email = craig.pelissier@nasa.gov
maintainer = Craig Pelissier
maintainer_email = craig.pelissier@nasa.gov
description = AI-based python framework for coupling tensor network models.
url = https://astg.pages.smce.nasa.gov/terrahydro/development/crest/
long_description = file: README.rst
long_description_content_type = text/x-rst
classifiers =
    Operating System :: OS Independent
    Intended Audience :: Science/Research
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.6
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10

project_urls =
    Documentation = https://astg.pages.smce.nasa.gov/terrahydro/development/crest/
    Issue Tracker = https://gitlab.smce.nasa.gov/astg/terrahydro/development/crest/issues
    Source Code = https://gitlab.smce.nasa.gov/astg/terrahydro/development/crest

[options]
packages = crest
include_package_data = True
zip_safe = True
python_requires = >=3.7.0
install_requires =
    tensorflow==2.10
    pytest==7.1.2
    matplotlib==3.7.1
    tqdm==4.64.1
    zarr==2.13.3
    pandas==1.5.3
    numpy==1.22
    fsspec==2023.3.0
    sparse==0.14.0
    pyarrow==11.0.0
    networkx==3.1
    ipykernel==6.19
    dask==2022.7.0
    bottleneck==1.3.5
    cloudpickle==2.0.0
    xarray==2022.11.0
    scikit-learn==1.3.0
    polars==0.18.8
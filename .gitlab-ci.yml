default:
  image:
    name: crest_cpu:latest
    pull_policy: if-not-present

before_script:
  # Activate conda
  - source /ASTG/pyenvs/production/etc/profile.d/conda.sh
  - conda update conda
  
  # Load local conda env and update if needed
  - conda activate crest_cpu
  - conda env update -f cicd/environment.yaml

test:
  script:
    - pytest --color=yes tests
  allow_failure: false

pages:
  stage: deploy
  script:
    # Update to add packages needed for doc generation
    - sphinx-build -b html docs public

  artifacts:
    paths:
    - public
  only:
    - develop
    - master

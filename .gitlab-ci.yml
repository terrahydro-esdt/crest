default:
  image:
    name: ocetra_cpu:latest
    pull_policy: if-not-present

variables:
  CI_PROJECT_DIR: /ASTG/sw/kraken/terrahydro/crest
before_script:
  # Activate conda & load env
  - source /ASTG/ops/ast_utils/etc/loadEnv.sh 
  - unset PYTHONPATH
  # Auto environment updates seem prone to breakage
  #- conda env update -f /ASTG/ops/ast_utils/etc/environment_cpu_x86_64.yaml

test:
  script:
    - pytest --color=yes tests
  allow_failure: false

doctest:
  script:
    - scripts/run_doctests.sh
  allow_failure: false

# Versions, changelog and (on a tag) the tag name must agree before a release
# reaches GitHub. See "Cutting a release" in docs/DEV_PROD_WORKFLOW.md.
release-check:
  script:
    - python scripts/release.py check ${CI_COMMIT_TAG:+--tag "$CI_COMMIT_TAG"}
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^release\//
  allow_failure: false

pages:
  stage: deploy
  script:
    # Update to add packages needed for doc generation
    - sphinx-build -b html docs public
  artifacts:
    paths:
    - public
  only:
    - env_dev
    - develop
    - main

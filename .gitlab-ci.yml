default:
  image:
    name: crest_cpu:1.03
    pull_policy: if-not-present

before_script:
  # Activate conda & load env
  - source cicd/loadEnv.sh 
  # update if needed.  Static cpu_x86_64 for now(ever?)
  - conda env update -f cicd/environment_cpu_x86_64.yaml

  # update if needed.  Static cpu_x86_64 for now(ever?)
  - conda env update -f cicd/environment_cpu_x86_64.yaml
test:
  script:
    - pytest --color=yes tests
  allow_failure: false

pages:
  stage: deploy
  script:
    # Update to add packages needed for doc generation
    - sphinx-build -b html docs public
  artifacts:
    paths:
    - public
  only:
    - env_dev
    - develop
    - master

[build-system]
requires = ["flit_core >=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "crest"
version = "0.1.0"
description = "AI-based python framework for coupling tensor network models."
readme = "README.rst"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  {name = "CREST Development Team"},
]
keywords = [
  "earth system modeling",
  "machine learning",
  "tensor graphs",
  "hydrological modeling",
  "climate science",
  "artificial intelligence",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# TODO: Update URLs when the repository is made public on GitHub (planned August 2026)
[project.urls]
Homepage = "https://astg.pages.smce.nasa.gov/terrahydro/development/crest/"
Documentation = "https://astg.pages.smce.nasa.gov/terrahydro/development/crest/"
Repository = "https://github.com/terrahydro-esdt/crest"
"Bug Tracker" = "https://github.com/terrahydro-esdt/crest/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "isort",
    "ruff",
    "mypy",
    "interrogate",
    "build",
    "twine",
]
docs = [
  "furo >=2023.9.10",
  "ipykernel",
  "myst-nb",
  "nbsphinx",
  "nbsphinx-link",
  "pydata-sphinx-theme",
  "sphinx >=7.0.0",
  "sphinx-autobuild >=2024.4.16",
  "sphinx-autodoc-typehints",
  "sphinx-design",
  "sphinx_rtd_theme",
  "sphinxcontrib-mermaid",
]

[tool.flit.sdist]
include = [
  "crest*",
  "LICENSE",
  "README.rst"
]

[tool.interrogate]
fail-under = 80
exclude = [
    "tests",
    "docs",
    "crest/archiver",
    "**/.ipynb_checkpoints",
    ".ipynb_checkpoints",
    "**/__*__.py",
    "crest/utils/matchup",
]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = true
ignore-module = true
verbose = 1
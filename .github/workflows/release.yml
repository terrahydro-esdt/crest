name: Release

# Publishes a GitHub Release when a version tag arrives (pushed by the GitLab
# push mirror after the tag is created on GitLab's main). Publishing the
# release is what makes Zenodo archive it and mint a DOI.
# See "Cutting a release" in docs/DEV_PROD_WORKFLOW.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

# Not "Release-<ref>": the called Tests workflow uses that group, and sharing
# a concurrency group with a called workflow deadlocks the run.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Versions, changelog and tag agree
        run: python scripts/release.py check --tag "$GITHUB_REF_NAME"

      - name: Tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME is not on main; tag main's release commit"
            exit 1
          }

  tests:
    needs: check
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py notes > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md
